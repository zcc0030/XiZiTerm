appId: io.github.zcc0030.xiziterm
productName: XiZiTerm
copyright: Copyright © 2026 zcc0030
electronVersion: "34.5.8"
npmRebuild: false

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - build/icon.png
  - build/icon.ico
  - package.json

extraResources:
  - from: ../../package.json
    to: sync-server-bundle/package.json
  - from: ../../tsconfig.base.json
    to: sync-server-bundle/tsconfig.base.json
  - from: ../../docker-compose.yml
    to: sync-server-bundle/docker-compose.yml
  - from: ../../packages/shared
    to: sync-server-bundle/packages/shared
    filter:
      - package.json
      - tsconfig.json
      - src/**/*
  - from: ../../apps/server
    to: sync-server-bundle/apps/server
    filter:
      - package.json
      - tsconfig.json
      - Dockerfile
      - docker-compose.yml
      - .env.example
      - src/**/*

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Development
  maintainer: zcc0030 <50785866+zcc0030@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
