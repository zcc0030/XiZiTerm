name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            platform: mac-x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install npm dependencies
        run: npm ci

      - name: Package Windows portable ZIP
        if: matrix.platform == 'win'
        run: npm run dist:win

      - name: Package macOS DMG & ZIP
        if: startsWith(matrix.platform, 'mac-')
        run: |
          npx --workspace=@xiziterm/desktop tauri build --target ${{ matrix.rust_target }} --bundles dmg,app
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$( [ "${{ matrix.rust_target }}" = "aarch64-apple-darwin" ] && echo "arm64" || echo "x64" )
          mkdir -p apps/desktop/release
          cp apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg "apps/desktop/release/XiZiTerm-${VERSION}-${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/XiZiTerm.app" "apps/desktop/release/XiZiTerm-${VERSION}-${ARCH}.zip"

      - name: Package Linux DEB & AppImage
        if: matrix.platform == 'linux'
        run: |
          npm run dist:linux
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apps/desktop/release
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "apps/desktop/release/XiZiTerm-${VERSION}-amd64.deb"
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage "apps/desktop/release/XiZiTerm-${VERSION}-x86_64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiZiTerm-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
