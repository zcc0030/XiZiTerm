name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure dual-arch node-pty prebuilts on macOS
        if: matrix.os == 'macos-latest'
        run: |
          for pkg in "@lydell/node-pty-darwin-x64" "@lydell/node-pty-darwin-arm64"; do
            dir="node_modules/$pkg"
            if [ ! -d "$dir" ]; then
              tgz=$(npm pack "$pkg@1.2.0-beta.18")
              mkdir -p "$dir"
              tar -xzf "$tgz" -C "$dir" --strip-components=1
              rm -f "$tgz"
            fi
          done
          chmod +x node_modules/@lydell/node-pty-darwin-*/spawn-helper || true

      - name: Build & package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiZiTerm-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
